[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oro-g2p"
version = "0.1.1"
authors = [
    { name = "Oro Contributors" }
]
description = "Research-grade Yoruba Grapheme-to-Phoneme (G2P) converter and Kokoro TTS frontend"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "yoruba",
    "g2p",
    "tts",
    "kokoro",
    "phonemes",
    "african-nlp",
    "speech-synthesis",
    "phonology"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Akintunde102/oro-g2p"
Repository = "https://github.com/Akintunde102/oro-g2p"
Issues = "https://github.com/Akintunde102/oro-g2p/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oro_g2p*"]
